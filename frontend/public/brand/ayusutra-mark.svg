<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="AyuSutra">
  <title>AyuSutra</title>
  <defs>
    <linearGradient id="ays-bg" x1="12" y1="2" x2="84" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b78f5"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0b1f3f"/>
    </linearGradient>
    <linearGradient id="ays-drop" x1="48" y1="10" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#ays-bg)"/>
  <!-- two leaves lean together to make the letter A (a plant, and the "sutra" thread of the knowledge) -->
  <path d="M46.6 34C31 45 17.5 63 19.5 84.5c15-4.2 25.6-23 27.1-50.5z" fill="#ffffff"/>
  <path d="M49.4 34C65 45 78.5 63 76.5 84.5c-15-4.2-25.6-23-27.1-50.5z" fill="#ffffff" fill-opacity="0.82"/>
  <!-- the bar of the A: one thread -->
  <path d="M30.5 69.5Q48 57.5 65.5 69.5" fill="none" stroke="#1d4ed8" stroke-width="3.6" stroke-linecap="round"/>
  <!-- the drop of medicated oil on top -->
  <path d="M48 8c4.4 6.6 9 11.4 9 16.8a9 9 0 0 1-18 0C39 19.4 43.6 14.6 48 8z" fill="url(#ays-drop)"/>
  <path d="M44.2 25.4c.5 2.6 2.1 4.2 4.5 4.6" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.7" stroke-linecap="round"/>
</svg>
